spring.config.import=optional:file:../.env.local[.properties]
spring.application.name=document-management-service
server.port=8079

spring.datasource.url=${DOCUMENT_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DOCUMENT_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DOCUMENT_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
