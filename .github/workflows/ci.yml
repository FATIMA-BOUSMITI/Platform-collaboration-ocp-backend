name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - User-service
          - project-management-service
          - communication-service
          - document-management-service
          - api-gatway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B -ntp test
      - name: Package application
        run: mvn -B -ntp -DskipTests package

  docker-build:
    name: Build Docker image ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - User-service
          - project-management-service
          - communication-service
          - document-management-service
          - api-gatway
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag platform/${{ matrix.service }}:ci ${{ matrix.service }}
