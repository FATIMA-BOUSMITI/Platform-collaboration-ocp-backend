server:
    port: 9000

spring:
    application:
        name: gateway-service

    cloud:
        gateway:
            routes:

                - id: auth-service-route
                  uri: http://localhost:8080
                  predicates:
                      - Path=/api/auth/**

                - id: role-service-route
                  uri: http://localhost:8080
                  predicates:
                      - Path=/api/roles/**
                - id: organisation-service
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/users/**

            globalcors:
                cors-configurations:
                    '[/**]':
                        allowedOrigins:
                            - "http://localhost:5173"
                        allowedMethods:
                            - GET
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                            - OPTIONS
                        allowedHeaders: "*"
                        allowCredentials: true
