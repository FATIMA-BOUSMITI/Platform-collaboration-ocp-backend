server:
  port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://localhost:8080
          predicates:
            - Path=/api/**

        - id: project-management-service-route
          uri: http://localhost:8082
          predicates:
              - Path=/api/projects/**


      globalcors:
          cors-configurations:
            '[/**]':
              allowedOrigins: "http://localhost:5173"
              allowedMethods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
              allowedHeaders: "*"
              allowCredentials: true