
services:
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    env_file:
      - ./auth-service/.env
    networks:
      - app-network

  projects-service:
    build:
      context: ./project-management-service
    container_name: project-management-service
    ports:
      - "8082:8082"
    env_file:
      - ./project-management-service/.env
    networks:
      - app-network

  conversations-service:
    build:
      context: ./communication-service
    container_name: communication-service
    ports:
      - "8089:8089"
    env_file:
      - ./communication-service/.env
    networks:
      - app-network

  gateway-service:
    build:
      context: ./api-gatway
    container_name: api-gatway
    ports:
      - "9000:9000"
    env_file:
      - ./api-gatway/.env
    depends_on:
      - auth-service
      - project-management-service
      - communication-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
